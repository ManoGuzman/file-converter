[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "file-converter"
version = "0.1.0"
description = "A file converter utility"
readme = "README.md"
license = "MIT"
dependencies = [
    "pdf2docx>=0.5.8",
    "pypandoc>=1.6.4",
    "pymupdf>=1.24.0",
    "pdfplumber>=0.10.0",
    "python-docx>=1.1.0",
    "pytest>=7.0.0",
    "pytest-mock>=3.11.0",
    "reportlab>=4.0.0",
    "pypdf>=4.0.0",
    "pdf2image>=1.17.0",
    "Pillow>=10.0.0",
    "ruff>=0.1.0",
    "black>=23.3.0"
]
